registry:
  name: FR Accounting & BTP Rules Registry
  version: 1.0.0-draft
  as_of: '2026-08-08'
  jurisdiction: FR
  scope:
  - FR_GENERAL
  - FR_BTP
  - FR_BTP_PUBLIC
  status: DRAFT_FOR_EXPERT_VALIDATION
  rule_count: 72
  principles:
  - Versionner les règles par date d'effet.
  - Séparer obligations légales/fiscales/comptables des règles contractuelles et techniques.
  - 'Calculs et validations déterministes : le LLM n''est pas la source de vérité.'
  - Décisions TVA/BTP au niveau transactionnel, pas au seul niveau du secteur d'activité.
  - Toute règle LEGAL/TAX/ACCOUNTING doit garder sa source officielle.
